services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    command: ["sh", "-ec", "npm install -g nodemon >/dev/null 2>&1 && exec nodemon --watch server.js server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
