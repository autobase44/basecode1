# Base44 sandbox/dev compose for base-code-e2e.
#
# The repo's own Dockerfile bakes the source (COPY . .) into a production image,
# so it cannot reflect live edits. Here the app runs straight from the cloned
# source, bind-mounted, with Node's built-in watcher for live reload.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
