services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    # nodemon gives live reload on bind-mounted source; --legacy-watch uses
    # polling which is more reliable across Docker bind mounts.
    command: ["sh", "-ec", "npx --yes nodemon --legacy-watch server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: on-failure
