# Base44 sandbox/dev compose for base-code-e2e.
#
# Runs the app from the cloned source (bind mount + node --watch) so edits show up
# live in the preview, instead of baking the source into an image via the repo's
# production Dockerfile.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# The app has no dependencies, no database and no environment variables required.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    # No dependency install step: this fixture intentionally has no dependencies.
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
