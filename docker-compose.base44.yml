# Base44 sandbox/dev compose for base-code-e2e.
#
# Runs the app from the cloned source (node runtime image + bind mount) so edits
# are picked up without rebuilding, and exposes the web entry point on host 3000.
# No database, dependency install, or external credentials are needed by this app.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    # `node --watch` restarts the server when server.js changes, so edits show up
    # in the preview without a rebuild.
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
