# Base44 sandbox/dev compose for base-code-e2e.
#
# Runs the app FROM THE CLONED SOURCE (plain node runtime image + bind mount),
# with Node's built-in watcher so later edits are picked up without a rebuild.
# There are no runtime dependencies (no package-lock.json, no node_modules), no
# database and no environment variables, so there is nothing to install and no
# secrets to wire in.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "--watch", "server.js"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Sandbox flag, passed through bare (unset => app behaves normally).
      - BASE44_PREVIEW_MODE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
    labels:
      base44.project: base-code-e2e
      base44.kind: web
      base44.port: "3000"
