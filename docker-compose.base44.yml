services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-ec", "exec node --watch server.js"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
