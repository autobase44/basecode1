services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    # Install nodemon globally (no repo deps) for live reload, then watch server.js.
    command: ["sh", "-c", "npm install -g nodemon >/dev/null 2>&1; exec nodemon --watch server.js server.js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: on-failure
