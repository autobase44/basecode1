services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
