services:
  web:
    image: node:20-alpine
    working_dir: /app
    # Run from the cloned source so edits are picked up without rebuilding.
    # `node --watch` restarts the server on file changes; no dependencies to install.
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure
