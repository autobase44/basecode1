# Base44 sandbox environment for base-code-e2e.
#
# Runs the app FROM THE CLONED SOURCE (bind-mounted at /app) on a plain Node
# runtime image, so edits to server.js are picked up without an image rebuild.
# The repo's own Dockerfile is deliberately NOT used here: it COPYs the source
# into a prebuilt image, which would freeze the code for a dev preview.
#
# The app has no dependencies, no database and no environment variables, so
# there is no install step and no secret wiring.
services:
  web:
    # Plain runtime base image (not the project's published/built app image).
    image: node:20
    working_dir: /app
    # node --watch restarts the single-file server when the source changes.
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
    # The app's own routes: `/` is the page, `/health` returns {"status":"ok"}.
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    restart: on-failure
    # Checks real application responsiveness on the existing /health endpoint.
    # Uses node itself (already in the image) — no curl/wget dependency.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    labels:
      base44.project: "base-code-e2e"
      base44.kind: "web"
      base44.port: "3000"
