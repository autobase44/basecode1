services:
  web:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
