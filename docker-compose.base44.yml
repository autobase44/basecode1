# Base44 sandbox/dev environment for base-code-e2e.
#
# The app is a single zero-dependency Node HTTP server that must run from the
# checked-out source so edits are picked up (node --watch restarts on change).
# There are no dependencies to install, no infrastructure services, and no
# secrets or environment variables required.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Runs the cloned source directly (never a prebuilt image) with live reload.
    command: ["node", "--watch", "server.js"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Passed through by the platform; empty/no-op for this app today but
      # available if an override is ever needed.
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
    healthcheck:
      # Read-only probe of the app's own /health endpoint using Node's built-in fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
