services:
  app:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["sh", "-c", "exec node --watch server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
