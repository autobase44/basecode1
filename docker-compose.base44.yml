# Base44 sandbox/dev environment.
# Runs the app FROM THE CLONED SOURCE (bind mount + live reload), never from a
# prebuilt image, so edits are visible without rebuilding.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Web entry point: http://localhost:3000  (host port 3000)
services:
  web:
    # Plain runtime base image (pre-cached). The app has no dependencies to install.
    image: node:22
    working_dir: /app
    # `node --watch` restarts the server when source files change (live reload).
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    healthcheck:
      # Probes real app responsiveness (the app's own /health endpoint).
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: on-failure
    labels:
      base44.project: base-code-e2e
      base44.kind: web
      base44.port: 3000
