# Base44 sandbox/dev environment.
#
# Runs the app FROM THE CLONED SOURCE (node:20-alpine + bind mount), never from the
# repo's Dockerfile, which bakes the source via `COPY . .` and would freeze edits.
# There are no dependencies to install, no environment variables and no database.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
