# Base44 sandbox dev environment.
# Runs the app FROM THE CLONED SOURCE (bind mount + live-reload) so edits appear
# without rebuilding an image. Not the repo's production Dockerfile.
# Usage: docker compose -f docker-compose.base44.yml up -d --build
services:
  web:
    image: node:20-alpine
    working_dir: /app
    # node --watch restarts the server on file changes (no dev dependencies needed).
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    healthcheck:
      # Uses the app's existing /health endpoint and busybox wget from the image.
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
