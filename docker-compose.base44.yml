services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
