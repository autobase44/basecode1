# Base44 dev environment for base-code-e2e.
#
# Runs the app from the CLONED SOURCE (bind-mounted), not from the repo's
# Dockerfile, which COPYs the source into a prebuilt image and would freeze
# every edit. This app has no dependencies, no environment variables and no
# database, so there is nothing to install and no infra to start.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["npm", "start"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Present only in the sandbox; absent means original behavior.
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: on-failure
