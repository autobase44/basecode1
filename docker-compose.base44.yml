# Base44 sandbox/dev compose file.
#
# Runs the app FROM THE CLONED SOURCE on a plain Node runtime image with the repo
# bind-mounted at /app, so edits are picked up live (node --watch) without rebuilds.
# The repo's own Dockerfile is intentionally NOT used here: it bakes the source into
# a prebuilt image, which would freeze the code for the edit loop.
services:
  web:
    image: node:20-alpine
    working_dir: /app
    # Live-reload dev command. `node --watch` restarts the server on file changes.
    command: ["node", "--watch", "server.js"]
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
