services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-ec", "npm install -g nodemon && exec nodemon --watch . server.js"]
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
