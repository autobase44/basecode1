# Base44 sandbox/dev environment.
#
# Runs the app FROM THE CLONED SOURCE (the repo is bind-mounted into a plain
# node base image) so edits are picked up without rebuilding an image.
#
# Usage:
#   docker compose -f docker-compose.base44.yml up -d
#   curl http://localhost:3000/        # page with heading "Base Code E2E"
#   curl http://localhost:3000/health  # {"status":"ok"}

services:
  web:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "--watch", "server.js"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - PORT=3000
      # Sandbox marker; empty/unset preserves normal behavior.
      - BASE44_PREVIEW_MODE
    volumes:
      - ./:/app
    restart: on-failure
    healthcheck:
      # Probe real app responsiveness via the app's own /health endpoint.
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
