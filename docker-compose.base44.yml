# Base44 dev environment for base-code-e2e.
#
# Runs the app FROM THE CLONED SOURCE (bind mount + `node --watch`), never from
# the repo's own Dockerfile: that image COPYs server.js into the image, so edits
# would be invisible in the preview.
#
# Usage:  docker compose -f docker-compose.base44.yml up -d
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-ec", "exec node --watch server.js"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - ./:/app
    restart: on-failure
    labels:
      base44.project: base-code-e2e
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
