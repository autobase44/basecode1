# Base44 sandbox/dev environment for base-code-e2e.
#
# Runs the app FROM THE CLONED SOURCE (bind-mounted) rather than the repo's own
# Dockerfile, which bakes the source into an image and would freeze every edit.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# The app has no dependencies, no database and needs no external credentials.

services:
  app:
    image: node:20-alpine
    working_dir: /app
    # node --watch restarts the server when server.js changes, so edits apply
    # without rebuilding an image.
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
