services:
  web:
    image: node:20-alpine
    working_dir: /app
    init: true
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    command: ["node", "--watch", "server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
