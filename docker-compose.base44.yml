services:
  web:
    image: node:20
    working_dir: /app
    command: ["sh", "-c", "exec node --watch server.js"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: on-failure
